<!doctype html><html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Khmer Inventory POS</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><div><h1>Khmer Inventory System</h1><p>ប្រព័ន្ធគ្រប់គ្រងស្តុក និងការលក់</p></div><span id="user"></span><button id="logout" class="hide">ចាកចេញ</button></header><main><section id="login" class="box login"><h2>ចូលប្រើប្រាស់</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">ចូលប្រព័ន្ធ</button><p id="loginMsg"></p></section><section id="app" class="hide"><nav><button data-page="pos">POS លក់ទំនិញ</button><button data-page="products">ស្តុកទំនិញ</button><button data-page="history">ប្រវត្តិលក់</button><button data-page="reports">របាយការណ៍ថ្ងៃនេះ</button></nav><section id="pos" class="page"><div class="layout"><div class="box"><h2>ជ្រើសរើសទំនិញ</h2><input id="search" placeholder="ស្វែងរកទំនិញ..."><div id="tiles" class="tiles"></div></div><div class="box"><h2>កន្ត្រកទំនិញ</h2><div id="cart"></div><label>អតិថិជន<input id="customer" placeholder="ឈ្មោះ"></label><label>ទូរស័ព្ទ<input id="phone"></label><label>បញ្ចុះតម្លៃ USD<input id="discount" type="number" value="0" min="0" step=".01"></label><label>អត្រាប្តូរ ៛ / $1<input id="rate" type="number" value="4100" min="1"></label><label>រូបិយប័ណ្ណទូទាត់<select id="currency"><option>USD</option><option>KHR</option></select></label><label>ប្រាក់បង់<input id="paid" type="number" value="0" min="0" step=".01"></label><div id="totals"></div><button id="checkout">បញ្ចប់ការលក់</button><p id="posMsg"></p></div></div></section><section id="products" class="page hide box"><h2>បន្ថែមទំនិញ</h2><input id="pname" placeholder="ឈ្មោះទំនិញ"><input id="sku" placeholder="SKU"><input id="qty" type="number" placeholder="ចំនួនស្តុក"><input id="price" type="number" step=".01" placeholder="តម្លៃ USD"><input id="image" placeholder="Image URL (optional)"><button id="add">បន្ថែមទំនិញ</button><p class="hint">តម្លៃ products.price ត្រូវបានចាត់ទុកជា USD។ សូមពិនិត្យតម្លៃចាស់ជាមុន។</p><div id="productRows"></div></section><section id="history" class="page hide box"><h2>ប្រវត្តិលក់</h2><button id="refreshHistory">Refresh</button><div id="historyRows"></div></section><section id="reports" class="page hide box"><h2>របាយការណ៍ថ្ងៃនេះ</h2><button id="refreshReport">Refresh</button><div id="reportRows"></div></section></section></main><section id="invoice"></section><script src="app.js"></script></body></html>
